name: Build Hiking Trails v0.1.31 3D HUD
on:
  push:
    branches:
      - hiking-trails-v0131-3d-hud

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare approved launcher artwork and trail assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-4888-81f5-9c94-dd6dc38db8cc/raw?se=2026-09-26T09%3A03%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=aadf48de-3b86-5fe0-97f3-309ce28df30e&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T05%3A45%3A57Z&ske=2026-09-27T05%3A45%3A57Z&sks=b&skv=2026-02-06&sig=bTJ7HvUw4MBqWvXevoPn2SV0moP7aT7j/waBSUTtVEs%3D' -o /tmp/v0130src.zip
          mkdir -p phone/src/main/res/drawable-nodpi watch/src/main/res/drawable-nodpi
          mkdir -p phone/src/main/assets watch/src/main/assets
          unzip -p /tmp/v0130src.zip icon_source.jpg > /tmp/icon_source.jpg
          unzip -p /tmp/v0130src.zip chapel_branch.gpx > phone/src/main/assets/chapel_branch.gpx
          cp phone/src/main/assets/chapel_branch.gpx watch/src/main/assets/chapel_branch.gpx
          python -m pip install --quiet pillow
          python - <<'PYICON'
          from PIL import Image
          import math, os
          src=Image.open('/tmp/icon_source.jpg').convert('RGB').resize((512,512),Image.Resampling.LANCZOS)
          sp=src.load()
          def bil(x,y):
            x=max(0,min(511,x)); y=max(0,min(511,y)); x0=int(x);y0=int(y);x1=min(511,x0+1);y1=min(511,y0+1);fx=x-x0;fy=y-y0
            a=sp[x0,y0];b=sp[x1,y0];c=sp[x0,y1];d=sp[x1,y1]
            return tuple(int((1-fy)*((1-fx)*a[k]+fx*b[k])+fy*((1-fx)*c[k]+fx*d[k])) for k in range(3))
          def phone(N=512,g=.78):
            out=Image.new('RGB',(N,N));op=out.load()
            for y in range(N):
              ny=y/(N-1)*2-1; sy=math.copysign(abs(ny)**g,ny) if ny else 0
              for x in range(N):
                nx=x/(N-1)*2-1; sx=math.copysign(abs(nx)**g,nx) if nx else 0
                op[x,y]=bil((sx+1)*.5*511,(sy+1)*.5*511)
            return out
          def watch(N=512,g=.78):
            out=Image.new('RGB',(N,N));op=out.load()
            for y in range(N):
              ny=y/(N-1)*2-1
              for x in range(N):
                nx=x/(N-1)*2-1;r=math.hypot(nx,ny);th=math.atan2(ny,nx);rr=min(1,r);co=math.cos(th);si=math.sin(th);bd=1/max(abs(co),abs(si),1e-9);sr=(rr**g)*bd;sx=max(-1,min(1,sr*co));sy=max(-1,min(1,sr*si));op[x,y]=bil((sx+1)*.5*511,(sy+1)*.5*511)
            return out
          for mod,img in [('phone',phone()),('watch',watch())]:
            img.save(f'{mod}/src/main/res/drawable-nodpi/hiking_icon_bg.jpg',quality=94,optimize=True)
          PYICON
          unzip -p /tmp/v0130src.zip phone/src/main/assets/chapel_branch_ready.jpg > phone/src/main/assets/chapel_branch_ready.jpg || true
          if [ ! -s phone/src/main/assets/chapel_branch_ready.jpg ]; then
            curl -L --fail --retry 3 'https://static.wixstatic.com/media/c33130_a0fc3236d1594c578a5297f609e86f62~mv2.jpg/v1/fill/w_900,h_900,fp_0.5_0.5,q_92/c33130_a0fc3236d1594c578a5297f609e86f62~mv2.jpg' -o phone/src/main/assets/chapel_branch_ready.jpg
          fi
          cp phone/src/main/assets/chapel_branch_ready.jpg watch/src/main/assets/chapel_branch_ready.jpg

      - name: Build release APKs
        run: gradle :phone:assembleRelease :watch:assembleRelease --stacktrace

      - name: Align and verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p out/tools
          "$BT/zipalign" -p -f 4 phone/build/outputs/apk/release/phone-release-unsigned.apk out/Hiking_Trails_PHONE_v0.1.31_ALIGNED_UNSIGNED.apk
          "$BT/zipalign" -p -f 4 watch/build/outputs/apk/release/watch-release-unsigned.apk out/Hiking_Trails_WATCH_v0.1.31_3D_HUD_ALIGNED_UNSIGNED.apk
          "$BT/zipalign" -c -v 4 out/Hiking_Trails_PHONE_v0.1.31_ALIGNED_UNSIGNED.apk
          "$BT/zipalign" -c -v 4 out/Hiking_Trails_WATCH_v0.1.31_3D_HUD_ALIGNED_UNSIGNED.apk
          {
            echo "HIKING TRAILS v0.1.31 3D HUD PRE-SIGN VERIFICATION"
            echo
            "$BT/aapt" dump badging out/Hiking_Trails_PHONE_v0.1.31_ALIGNED_UNSIGNED.apk | grep -E "^(package:|application-label:|uses-feature:)" | head -20
            echo
            "$BT/aapt" dump badging out/Hiking_Trails_WATCH_v0.1.31_3D_HUD_ALIGNED_UNSIGNED.apk | grep -E "^(package:|application-label:|uses-feature:)" | head -20
            echo
            sha256sum out/*.apk
          } > out/PRE_SIGN_VERIFY.txt
          cp "$BT/lib/apksigner.jar" out/tools/apksigner.jar
          cp "$BT/aapt" out/tools/aapt
          chmod +x out/tools/aapt

      - name: Upload aligned unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: Hiking-Trails-v0.1.31-3D-HUD-aligned-unsigned
          path: out/**
          retention-days: 1
