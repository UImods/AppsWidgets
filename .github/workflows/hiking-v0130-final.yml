name: Build Hiking Trails v0.1.30 final
on:
  push:
    branches:
      - hiking-trails-v0130-final-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare exact approved build inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-05d8-81f5-bf41-01339272ecc2/raw?se=2026-09-26T05%3A12%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=25281bb2-f905-58c2-9302-7411bf7671c6&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T03%3A55%3A47Z&ske=2026-09-27T03%3A55%3A47Z&sks=b&skv=2026-02-06&sig=7OGK1Vm%2BC4/TlTmwHtv8nlm2%2BwJFRRLfIY1TiZFhzxQ%3D' -o /tmp/build_inputs.zip
          echo '61ff2f7a0f90a225891522c7773ee05666e2333c6dd2c0e65e27bdc332b6df2b  /tmp/build_inputs.zip' | sha256sum -c -
          mkdir -p phone/src/main/res/drawable-nodpi watch/src/main/res/drawable-nodpi
          mkdir -p phone/src/main/assets watch/src/main/assets
          unzip -p /tmp/build_inputs.zip phone_icon.jpg > phone/src/main/res/drawable-nodpi/hiking_icon_bg.jpg
          unzip -p /tmp/build_inputs.zip watch_icon.jpg > watch/src/main/res/drawable-nodpi/hiking_icon_bg.jpg
          unzip -p /tmp/build_inputs.zip chapel_branch.gpx > phone/src/main/assets/chapel_branch.gpx
          cp phone/src/main/assets/chapel_branch.gpx watch/src/main/assets/chapel_branch.gpx
          curl -L --fail --retry 3 'https://static.wixstatic.com/media/c33130_a0fc3236d1594c578a5297f609e86f62~mv2.jpg/v1/fill/w_900,h_900,fp_0.5_0.5,q_92/c33130_a0fc3236d1594c578a5297f609e86f62~mv2.jpg' -o phone/src/main/assets/chapel_branch_ready.jpg
          cp phone/src/main/assets/chapel_branch_ready.jpg watch/src/main/assets/chapel_branch_ready.jpg
          test "$(sha256sum phone/src/main/res/drawable-nodpi/hiking_icon_bg.jpg | cut -d' ' -f1)" = "450907d100b07340a087b62e804eccc033a466ea606c38981c4e0522ee8db97d"
          test "$(sha256sum watch/src/main/res/drawable-nodpi/hiking_icon_bg.jpg | cut -d' ' -f1)" = "73634783c6814afb6aaf16c843555871d23b673ce2b8d12a38e1ae83c81ff5b1"
          test "$(sha256sum phone/src/main/assets/chapel_branch.gpx | cut -d' ' -f1)" = "95d3fd0ce37001326a7ac63a34f7574e1d3f2cf9cb000854a4393217cf32a245"

      - name: Build release APKs
        run: gradle :phone:assembleRelease :watch:assembleRelease --stacktrace

      - name: Align and verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p out/tools
          "$BT/zipalign" -p -f 4 phone/build/outputs/apk/release/phone-release-unsigned.apk out/Hiking_Trails_PHONE_v0.1.30_ALIGNED_UNSIGNED.apk
          "$BT/zipalign" -p -f 4 watch/build/outputs/apk/release/watch-release-unsigned.apk out/Hiking_Trails_WATCH_v0.1.30_ALIGNED_UNSIGNED.apk
          "$BT/zipalign" -c -v 4 out/Hiking_Trails_PHONE_v0.1.30_ALIGNED_UNSIGNED.apk
          "$BT/zipalign" -c -v 4 out/Hiking_Trails_WATCH_v0.1.30_ALIGNED_UNSIGNED.apk
          {
            echo "HIKING TRAILS v0.1.30 PRE-SIGN VERIFICATION"
            echo
            echo "PHONE:"
            "$BT/aapt" dump badging out/Hiking_Trails_PHONE_v0.1.30_ALIGNED_UNSIGNED.apk | grep -E "^(package:|application-label:|uses-feature:)" | head -20
            echo
            echo "WATCH:"
            "$BT/aapt" dump badging out/Hiking_Trails_WATCH_v0.1.30_ALIGNED_UNSIGNED.apk | grep -E "^(package:|application-label:|uses-feature:)" | head -20
            echo
            sha256sum out/*.apk
          } > out/PRE_SIGN_VERIFY.txt
          cp "$BT/lib/apksigner.jar" out/tools/apksigner.jar
          cp "$BT/aapt" out/tools/aapt
          chmod +x out/tools/aapt

      - name: Upload unsigned aligned build
        uses: actions/upload-artifact@v4
        with:
          name: Hiking-Trails-v0.1.30-aligned-unsigned
          path: out/**
          retention-days: 1
